name: RESX fast feedback
on:
  push:
    branches: ['codex/**', 'feature/**', 'fix/**', 'migration/**']
permissions:
  contents: read
concurrency:
  group: resx-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    name: RESX WIP source feedback
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - run: node --test bin/resx-cicd.test.cjs bin/resx-reconcile.test.cjs
      - run: python3 -B bin/resx-export-context.test.py
# Feedback only: never emits RESX CI/policy success, merges, promotes or deploys.
