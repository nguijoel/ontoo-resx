name: RESX PRE release
on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, rollback]
        default: rollback
        required: true
      release_id:
        description: Retained release ID for an authorized rollback; never a manifest or command
        type: string
        required: false
      expected_sha:
        description: Exact staging tip selected by protected merge handoff
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: resx-pre-release
  cancel-in-progress: false
jobs:
  scope:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.impact.outputs.deploy }}
    steps:
      - name: Restrict explicit rollback to the authorised owner
        if: inputs.action == 'rollback'
        env:
          ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: test "$EVENT_NAME" = workflow_dispatch && test "$ACTOR_ID" = 6606980
      - name: Reject moved automatic release handoff
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$ACTION" = deploy ]; then
            [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] && test "$EXPECTED_SHA" = "$GITHUB_SHA"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine release impact without acquiring credentials
        id: impact
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),c=require('./bin/resx-cicd.cjs');
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          let deploy=true;
          let before=event.before;
          if(event.inputs?.action==='deploy') {
            before=require('node:child_process').execFileSync('git',['rev-parse','--verify',process.env.GITHUB_SHA+'^1'],{encoding:'utf8'}).trim();
          }
          if(before&&/^[a-f0-9]{40}$/.test(before)&&!/^0+$/.test(before)) {
            const files=c.changedFiles(before,process.env.GITHUB_SHA);
            deploy=files.length>0&&!c.classify(files).documentationOnly;
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'deploy='+deploy+'\n');
          NODE
  enrollment:
    needs: scope
    if: github.ref == 'refs/heads/staging' && needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require independently installed PRE controls
        env:
          ENROLLED: ${{ vars.RESX_PRE_ENROLLED }}
        run: test "$ENROLLED" = true
  image:
    needs: enrollment
    if: github.ref == 'refs/heads/staging' && inputs.action != 'rollback' && vars.RESX_PRE_ENROLLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      release_id: ${{ steps.receipt.outputs.release_id }}
      receipt_json: ${{ steps.receipt.outputs.receipt_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export immutable allowlisted build context
        run: python3 -B bin/resx-export-context.py "$GITHUB_SHA" "$RUNNER_TEMP/resx-context.tar"
      - name: Build immutable image
        run: |
          closure=$(python3 -c 'import json,os;from pathlib import Path;print(json.loads((Path(os.environ["RUNNER_TEMP"])/"resx-context.tar.receipt.json").read_text())["databaseClosure"]["sha256"])')
          [[ "$closure" =~ ^[a-f0-9]{64}$ ]]
          docker build --platform linux/amd64 --file deploy/resx/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "com.ontoo.resx.db-closure-sha256=$closure" \
            --label "org.opencontainers.image.source=https://github.com/nguijoel/ontoo-resx" \
            --iidfile "$RUNNER_TEMP/resx-image.id" --tag "resx-ci:$GITHUB_SHA" - < "$RUNNER_TEMP/resx-context.tar"
      - name: Qualify native modules without DB, network or secrets
        run: |
          image=$(cat "$RUNNER_TEMP/resx-image.id")
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = '10001:10001'
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 10001:10001 --memory 256m --cpus .5 --pids-limit 64 --entrypoint node "$image" \
            -e "const b=require('bcrypt');if(!b.compareSync('synthetic',b.hashSync('synthetic',4)))process.exit(1);require('mysql2');const fs=require('node:fs');for(const [p,v] of [['mysql2','3.14.0'],['typeorm','0.3.28']])if(JSON.parse(fs.readFileSync('node_modules/'+p+'/package.json','utf8')).version!==v)process.exit(1);require('./bin/resx-runtime-profile.cjs');"
      - name: Publish qualified image to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/resx-registry
        run: |
          set -eu
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image=$(cat "$RUNNER_TEMP/resx-image.id")
          tag="ghcr.io/nguijoel/ontoo-resx:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag "$image" "$tag"
          docker push "$tag"
          docker image inspect --format '{{json .RepoDigests}}' "$tag" > "$RUNNER_TEMP/resx-registry-digests.json"
      - name: Bind immutable registry image to source and run
        id: receipt
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);image=(root/'resx-image.id').read_text().strip()
          assert re.fullmatch(r'sha256:[a-f0-9]{64}',image)
          repository='ghcr.io/nguijoel/ontoo-resx'
          digests=json.loads((root/'resx-registry-digests.json').read_text())
          matched=[d for d in digests if re.fullmatch(re.escape(repository)+r'@sha256:[a-f0-9]{64}',d)]
          assert len(matched)==1
          receipt={'repositoryId':'795522855','sourceSha':os.environ['GITHUB_SHA'],
              'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'registryRepository':repository,'registryManifestDigest':matched[0].split('@')[1],'imageId':image}
          data=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()
          (root/'resx-release-receipt.json').write_bytes(data)
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('release_id='+hashlib.sha256(data).hexdigest()+'\n')
              stream.write('receipt_json='+data.decode()+'\n')
          PY
      - name: Upload separate bound receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resx-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resx-release-receipt.json
          retention-days: 7
          if-no-files-found: error
  deployment:
    name: RESX PRE controller integration
    if: always() && github.ref == 'refs/heads/staging' && vars.RESX_PRE_ENROLLED == 'true' && needs.enrollment.result == 'success' && (needs.image.result == 'success' || (inputs.action == 'rollback' && needs.image.result == 'skipped'))
    needs: [enrollment, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: hosting-pre
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - name: Release through the restricted existing controller
        env:
          GH_TOKEN: ${{ github.token }}
          RESX_ACTION: ${{ inputs.action || 'deploy' }}
          RESX_RECEIPT_JSON: ${{ needs.image.outputs.receipt_json }}
          RESX_RELEASE_ID: ${{ inputs.release_id }}
          RESX_DEPLOY_KEY: ${{ secrets.ONTOO_RESX_PRE_DEPLOY_SSH_KEY }}
        run: node bin/resx-release.cjs
      - name: Retain public request and sanitized terminal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resx-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/resx-release-request.json
            ${{ runner.temp }}/resx-release-result.json
            ${{ runner.temp }}/resx-release-attempts.jsonl
            ${{ runner.temp }}/resx-release-transport.json
          if-no-files-found: ignore
          retention-days: 90
# No private key, raw SSH error, arbitrary remote command or custom ingress.
# Root admission/current-state/config/DB/digest/audit checks precede mutation.
